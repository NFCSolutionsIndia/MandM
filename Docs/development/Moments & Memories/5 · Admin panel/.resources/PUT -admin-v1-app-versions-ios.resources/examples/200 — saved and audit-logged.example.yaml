$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/admin/v1/app-versions/ios"
  method: PUT
  headers:
    Authorization: Bearer {{adminToken}}
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "latestVersion": "1.4.0",
        "minSupportedVersion": "1.3.0",
        "storeUrl": "https://apps.apple.com/app/id0000000000",
        "releaseNotes": "Faster uploads."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "platform": "ios",
        "latestVersion": "1.4.0",
        "minSupportedVersion": "1.3.0",
        "storeUrl": "https://apps.apple.com/app/id0000000000",
        "releaseNotes": "Faster uploads.",
        "updatedBy": {
          "id": "019a7b3c-5d2e-7f10-8a4b-1c2d3e4f5a6b",
          "email": "admin@example.com"
        },
        "updatedAt": "2026-11-14T10:00:00.000Z"
      }
order: 1000
