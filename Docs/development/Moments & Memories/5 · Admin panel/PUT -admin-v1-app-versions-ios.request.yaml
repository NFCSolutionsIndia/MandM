$kind: http-request
name: PUT /admin/v1/app-versions/ios
description: |-
  Replaces one platform's row — PUT, so storeUrl and releaseNotes left out are cleared. Every change writes an audit_logs row (action app_version.updated) with the admin and the old and new values.

  422 when a version is not x.y.z (no leading zeros), minSupportedVersion is newer than latestVersion, or storeUrl is not https://. 404 for a platform other than ios or android.

  Swap ios for android in the URL to set Android.
url: "{{baseUrl}}/api/v1/admin/v1/app-versions/ios"
method: PUT
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "latestVersion": "1.4.0",
      "minSupportedVersion": "1.3.0",
      "storeUrl": "https://apps.apple.com/app/id0000000000",
      "releaseNotes": "Faster uploads."
    }
scripts:
  - type: afterResponse
    code: pm.test('200', () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/PUT -admin-v1-app-versions-ios.resources/examples
order: 8000
