$kind: http-request
name: "POST /members"
description: "201 with the person, as GET /members/:id returns them. Saves {{memberId}}. 422 for an invalid field (field and message only; values are never echoed)."
url: "{{baseUrl}}/api/v1/members"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Aarav",
      "nickname": "Aaru",
      "location": "Pune, MH",
      "relationship": "son",
      "birthday": "2012-05-04",
      "birthdayPrecision": "day",
      "anniversary": null,
      "phone": "+919876543210",
      "email": "aarav@example.com",
      "notes": "Loves cricket",
      "avatarMediaId": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('memberId', pm.response.json().id);
    language: text/javascript
examples: ./.resources/POST -members.resources/examples
order: 1000
