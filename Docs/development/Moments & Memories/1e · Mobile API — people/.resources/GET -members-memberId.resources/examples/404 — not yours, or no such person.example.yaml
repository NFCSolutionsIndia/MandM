$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/members/{{memberId}}"
  method: GET
  headers:
    Authorization: Bearer {{token}}
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Not Found",
        "statusCode": 404
      }
order: 2000
