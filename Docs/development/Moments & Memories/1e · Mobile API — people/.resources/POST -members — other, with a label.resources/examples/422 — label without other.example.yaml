$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/members"
  method: POST
  headers:
    Authorization: Bearer {{token}}
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "name": "Kavya",
        "relationship": "other",
        "relationshipLabel": "school friend"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Validation failed",
        "errors": [
          {
            "field": "relationshipLabel",
            "message": "is only allowed when relationship is \"other\""
          }
        ]
      }
order: 2000
