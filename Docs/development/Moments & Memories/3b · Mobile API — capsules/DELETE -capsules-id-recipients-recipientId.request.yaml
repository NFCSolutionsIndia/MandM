$kind: http-request
name: DELETE /capsules/:id/recipients/:recipientId
description: "Only while the capsule is a draft. Once sealed, its recipients are settled: 409."
url: "{{baseUrl}}/api/v1/capsules/{{capsuleId}}/recipients/{{extraRecipientId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200',()=>pm.response.to.have.status(200));
      pm.test('removed',()=>pm.expect(pm.response.json().removed).to.eql(true));
    language: text/javascript
order: 6000
