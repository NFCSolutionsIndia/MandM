$kind: http-request
name: POST /vaults
description: |-
  type: personal | shared | legacy

  Two writes in one transaction — the vault and the owner's membership row — so a vault with no members cannot exist.
url: "{{baseUrl}}/api/v1/vaults"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "name": "Family",
      "type": "shared"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('vaultId', pm.response.json().id);
    language: text/javascript
order: 1000
