$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/users/me/username"
  method: PATCH
  headers:
    Authorization: Bearer {{token}}
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "username": "{{newUsername}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "username": "aarav.k",
        "changed": true,
        "usernameChangedAt": "2026-11-15T10:00:00.000Z",
        "usernameChangeableAt": "2026-11-29T10:00:00.000Z"
      }
order: 1000
