$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/users/me/username"
  method: PATCH
  headers:
    Authorization: Bearer {{token}}
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "username": "support"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Validation failed",
        "errors": [
          {
            "field": "username",
            "message": "is reserved"
          }
        ]
      }
order: 1000
