$kind: http-request
name: GET /health
description: "No auth, and deliberately so: a guard here would make every container fail its health check and roll the deploy back."
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
