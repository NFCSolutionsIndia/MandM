$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/moments/upcoming?types=capsule,chats"
  method: GET
  headers:
    Authorization: Bearer {{token}}
response:
  statusCode: 400
  statusText: "Bad Request"
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Validation failed",
        "errors": [
          {
            "field": "types.1",
            "message": "Invalid option: expected one of \"capsule\"|\"birthday\"|\"anniversary\"|\"event\""
          }
        ]
      }
order: 2000
