$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/verify"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "email": "{{email}}",
        "code": "{{code}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 401,
        "message": "That code is not valid.",
        "error": "Unauthorized"
      }
order: 2000
