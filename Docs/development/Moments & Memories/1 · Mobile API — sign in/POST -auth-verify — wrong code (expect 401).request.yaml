$kind: http-request
name: POST /auth/verify — wrong code (expect 401)
description: Worth running deliberately. Five of these spend the code entirely — the limit is enforced in the database, not here.
url: "{{baseUrl}}/api/v1/auth/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "code": "000000"
    }
scripts:
  - type: afterResponse
    code: pm.test('401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
