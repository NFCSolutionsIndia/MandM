$kind: http-request
name: POST /auth/request-code
description: |-
  Always 202, for any address.

  That is the whole point: a 404 for unknown addresses would turn this into a way to ask the server whether somebody has an account here. Creating an account and signing in are the same request — there is no separate sign-up.

  Optional `fullName` (1–200 characters), `countryCode` (+ and 1–3 digits, e.g. +91) and `mobileNumber` (exactly 10 digits; spaces and dashes are removed). countryCode and mobileNumber are sent together or not at all, and are stored as one number, e.g. +919876543215. All three are used only when verifying this code CREATES the account. They never change an existing account. The phone is stored unverified.
url: "{{baseUrl}}/api/v1/auth/request-code"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "fullName": "Emma Carter",
      "countryCode": "+91",
      "mobileNumber": "9876543215"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('202 Accepted', () => pm.response.to.have.status(202));
      pm.test('says nothing about whether the account exists', () => {
        pm.expect(pm.response.json().status).to.include('If that address');
      });
      console.log('Now get the code: npm run dev:code -- ' + pm.collectionVariables.get('email'));
    language: text/javascript
order: 1000
