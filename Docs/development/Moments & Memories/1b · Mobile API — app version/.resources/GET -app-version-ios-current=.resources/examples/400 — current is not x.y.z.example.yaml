$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/app-version/ios?current={{appVersion}}"
  method: GET
  queryParams:
    current: "{{appVersion}}"
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Validation failed",
        "errors": [
          {
            "field": "current",
            "message": "must be an x.y.z version, such as 1.4.0"
          }
        ]
      }
order: 4000
