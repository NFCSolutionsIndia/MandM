$kind: http-example
name: "200 — between minimum and latest: update available"
request:
  url: "{{baseUrl}}/api/v1/app-version/ios?current={{appVersion}}"
  method: GET
  queryParams:
    current: "{{appVersion}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
    Cache-Control: public, max-age=300
  body:
    type: json
    content: |-
      {
        "platform": "ios",
        "latestVersion": "1.4.0",
        "minSupportedVersion": "1.3.0",
        "updateAvailable": true,
        "forceUpdate": false,
        "storeUrl": "https://apps.apple.com/app/id0000000000",
        "releaseNotes": "Faster uploads."
      }
order: 2000
