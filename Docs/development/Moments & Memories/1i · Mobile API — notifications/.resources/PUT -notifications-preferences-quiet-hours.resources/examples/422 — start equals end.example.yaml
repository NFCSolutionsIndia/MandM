$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/notifications/preferences/quiet-hours"
  method: PUT
  headers:
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "start": "22:00",
        "end": "22:00"
      }
response:
  statusCode: 422
  statusText: "Unprocessable Entity"
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Validation failed",
        "errors": [
          {
            "field": "end",
            "message": "must differ from start"
          }
        ]
      }
order: 2000
