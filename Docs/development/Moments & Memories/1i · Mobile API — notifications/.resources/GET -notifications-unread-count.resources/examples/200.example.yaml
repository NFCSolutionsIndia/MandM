$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/notifications/unread-count"
  method: GET
  headers:
    Authorization: Bearer {{token}}
response:
  statusCode: 200
  statusText: "OK"
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "unread": 3
      }
order: 1000
