$kind: http-request
name: "PATCH /events/{{eventId}}"
description: "Any subset of fields. memberIds replaces the whole list ([] removes everyone)."
url: "{{baseUrl}}/api/v1/events/{{eventId}}"
method: PATCH
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Mom & Dad’s wedding",
      "notes": "Dinner at 8"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/PATCH -events-eventId.resources/examples
order: 4000
