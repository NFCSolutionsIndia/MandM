$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/events/{{eventId}}"
  method: PATCH
  headers:
    Authorization: Bearer {{token}}
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "title": "Mom & Dad’s wedding",
        "notes": "Dinner at 8"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "id": "019a8c10-0000-7000-8000-00000000e002",
        "title": "Mom & Dad’s wedding",
        "type": "anniversary",
        "eventDate": "1988-12-01",
        "recurrence": "yearly",
        "allDay": true,
        "notes": "Dinner at 8",
        "nextOccurrence": "2026-12-01",
        "daysLeft": 15,
        "members": [
          {
            "id": "019a8c10-0000-7000-8000-00000000a003",
            "name": "Mom"
          }
        ],
        "archivedAt": null,
        "createdAt": "2026-11-16T10:00:00.000Z",
        "updatedAt": "2026-11-16T10:00:00.000Z"
      }
order: 1000
