$kind: http-request
name: "DELETE /events/{{eventId}} (archive)"
description: "Archives the event (204). It leaves GET /events and /moments/upcoming, and shows in GET /events?archived=true."
url: "{{baseUrl}}/api/v1/events/{{eventId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('204', () => pm.response.to.have.status(204));
    language: text/javascript
examples: ./.resources/DELETE -events-eventId (archive).resources/examples
order: 5000
