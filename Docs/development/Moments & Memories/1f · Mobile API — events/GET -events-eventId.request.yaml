$kind: http-request
name: "GET /events/{{eventId}}"
url: "{{baseUrl}}/api/v1/events/{{eventId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
    language: text/javascript
examples: ./.resources/GET -events-eventId.resources/examples
order: 3000
