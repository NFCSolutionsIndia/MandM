$kind: http-request
name: "GET /search?q=dad (All)"
description: |-
  Every section, five each. Only the requested sections are present in the response.
url: "{{baseUrl}}/api/v1/search?q=dad&limit=5"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  q: "dad"
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('three sections', () => ['people', 'memories', 'dates'].forEach((k) => pm.expect(b).to.have.property(k)));
    language: text/javascript
examples: ./.resources/GET -search-q=dad.resources/examples
order: 1000
