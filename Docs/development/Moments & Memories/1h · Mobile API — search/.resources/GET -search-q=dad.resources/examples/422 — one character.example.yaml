$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/search?q=d"
  method: GET
  headers:
    Authorization: Bearer {{token}}
response:
  statusCode: 422
  statusText: "Unprocessable Entity"
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Validation failed",
        "errors": [
          {
            "field": "q",
            "message": "must be at least 2 characters"
          }
        ]
      }
order: 2000
