$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/refresh"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "refreshToken": "{{previousRefreshToken}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 401,
        "message": "Session expired. Sign in again.",
        "error": "Unauthorized"
      }
order: 1000
